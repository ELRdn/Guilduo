name: Diagnose public shell comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare public shell responses without deploying
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { normalizePublicShell, previousShellProbe } from './tools/retain-site-assets.mts';
          const origin = new URL('https://app.guilduo.com');
          const read = async () => {
            const response = await fetch(new URL('/next/relay-forge/', origin), {redirect:'error'});
            if (!response.ok) throw new Error('Public shell HTTP ' + response.status);
            return response.text();
          };
          const captured = await read();
          for (let i=0; i<3; i++) {
            const active = await read();
            for (const [kind, a, b] of [
              ['source', normalizePublicShell(captured), normalizePublicShell(active)],
              ['probe', normalizePublicShell(previousShellProbe(captured,origin)), normalizePublicShell(previousShellProbe(active,origin))]
            ]) {
              let at = 0;
              while (at < a.length && a[at] === b[at]) at++;
              console.log(JSON.stringify({i,kind,equal:a===b,lengths:[a.length,b.length],at,captured:a.slice(Math.max(0,at-100),at+180),active:b.slice(Math.max(0,at-100),at+180)}));
            }
          }
          NODE
