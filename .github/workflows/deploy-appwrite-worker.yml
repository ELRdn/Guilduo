name: Deploy Appwrite Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-appwrite-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate ignored production configuration
        run: npm run generate-release-config
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ vars.APPWRITE_DATABASE_ID }}
          APPWRITE_STATE_TABLE_ID: ${{ vars.APPWRITE_STATE_TABLE_ID }}
          APPWRITE_LEGACY_TABLE_ID: ${{ vars.APPWRITE_LEGACY_TABLE_ID }}
          WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          SOURCE_URL: ${{ vars.SOURCE_URL }}
          EXTERNAL_OAUTH_ENABLED: ${{ vars.EXTERNAL_OAUTH_ENABLED || 'false' }}
          JOIN_GUILD_URL: ${{ vars.JOIN_GUILD_URL || '/next/' }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      - run: npm run api:generate && git diff --exit-code -- api/openapi.json api/mcp-tools.json
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Apply additive D1 migrations
        run: npx wrangler d1 migrations apply "${{ vars.D1_DATABASE_NAME }}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish Appwrite Worker secret
        shell: bash
        run: printf '%s' "$APPWRITE_API_KEY" | npx wrangler secret put APPWRITE_API_KEY
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify production Worker
        shell: bash
        run: |
          health="$(curl --fail --retry 5 --retry-delay 3 '${{ vars.WORKER_BASE_URL }}/health')"
          node -e 'const h=JSON.parse(process.argv[1]); if(h.version!=="2.7.0"||h.schemaVersion!==7||h.agentStorage!=="d1") process.exit(1)' "$health"
          curl --fail '${{ vars.WORKER_BASE_URL }}/.well-known/oauth-authorization-server' >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' '${{ vars.WORKER_BASE_URL }}/v1/quests')" = "401"
          cors_ok=false
          for attempt in {1..10}; do
            cors="$(curl -sS -D - -o /dev/null -X OPTIONS \
              -H 'Origin: ${{ vars.WEB_APP_URL }}' \
              -H 'Access-Control-Request-Method: GET' \
              '${{ vars.WORKER_BASE_URL }}/v1/quests')"
            if printf '%s' "$cors" | tr -d '\r' | grep -Fqi "access-control-allow-origin: ${{ vars.WEB_APP_URL }}"; then
              cors_ok=true
              break
            fi
            sleep 3
          done
          test "$cors_ok" = true
