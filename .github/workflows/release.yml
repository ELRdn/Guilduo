name: Tagged Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate ignored public deployment configuration
        run: npm run generate-release-config
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ vars.APPWRITE_DATABASE_ID }}
          APPWRITE_STATE_TABLE_ID: ${{ vars.APPWRITE_STATE_TABLE_ID }}
          APPWRITE_LEGACY_TABLE_ID: ${{ vars.APPWRITE_LEGACY_TABLE_ID }}
          WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          SOURCE_URL: ${{ vars.SOURCE_URL }}
          EXTERNAL_OAUTH_ENABLED: ${{ vars.EXTERNAL_OAUTH_ENABLED || 'false' }}
          JOIN_GUILD_URL: ${{ vars.JOIN_GUILD_URL || '/next/' }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      - run: npm run api:generate && git diff --exit-code -- api/openapi.json api/mcp-tools.json
      - run: npm run design:check
      - run: npx -y -p @google/design.md designmd lint DESIGN.md
      - run: npx -y -p @google/design.md designmd lint interaction-lab/DESIGN.md
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Apply additive D1 migrations
        run: npx wrangler d1 migrations apply "${{ vars.D1_DATABASE_NAME }}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Appwrite Site
        id: appwrite_site
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/guilduo-site.tar.gz" -C dist .
          deployment="$(bash tools/deploy-appwrite-site.sh "$RUNNER_TEMP/guilduo-site.tar.gz")"
          echo "$deployment"
          echo "url=$(jq -er '.url' <<<"$deployment")" >> "$GITHUB_OUTPUT"
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_SITE_ID: ${{ vars.APPWRITE_SITE_ID }}
          APPWRITE_DEPLOY_KEY: ${{ secrets.APPWRITE_DEPLOY_KEY }}
      - name: Register active Appwrite Site as the web platform
        shell: bash
        run: |
          hostname="${SITE_URL#https://}"
          curl --silent --show-error --fail \
            --request PUT \
            --header "X-Appwrite-Project: $APPWRITE_PROJECT_ID" \
            --header "X-Appwrite-Key: $APPWRITE_DEPLOY_KEY" \
            --header "Content-Type: application/json" \
            --data "$(jq -cn --arg name 'Guilduo Appwrite Site' --arg hostname "$hostname" '{name:$name,hostname:$hostname}')" \
            "$APPWRITE_ENDPOINT/project/platforms/web/$APPWRITE_WEB_PLATFORM_ID" >/dev/null
        env:
          SITE_URL: ${{ steps.appwrite_site.outputs.url }}
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_WEB_PLATFORM_ID: ${{ vars.APPWRITE_WEB_PLATFORM_ID }}
          APPWRITE_DEPLOY_KEY: ${{ secrets.APPWRITE_DEPLOY_KEY }}
      - name: Regenerate Worker configuration for active Appwrite Site
        run: npm run generate-release-config
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ vars.APPWRITE_DATABASE_ID }}
          APPWRITE_STATE_TABLE_ID: ${{ vars.APPWRITE_STATE_TABLE_ID }}
          APPWRITE_LEGACY_TABLE_ID: ${{ vars.APPWRITE_LEGACY_TABLE_ID }}
          WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
          WEB_APP_URL: ${{ steps.appwrite_site.outputs.url }}
          SOURCE_URL: ${{ vars.SOURCE_URL }}
          EXTERNAL_OAUTH_ENABLED: ${{ vars.EXTERNAL_OAUTH_ENABLED || 'false' }}
          JOIN_GUILD_URL: ${{ vars.JOIN_GUILD_URL || '/next/' }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      - name: Publish Appwrite Worker secret
        shell: bash
        run: printf '%s' "$APPWRITE_API_KEY" | npx wrangler secret put APPWRITE_API_KEY
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify Worker after Appwrite Sites
        shell: bash
        run: |
          health="$(curl --fail --retry 5 --retry-delay 3 '${{ vars.WORKER_BASE_URL }}/health')"
          node -e 'const h=JSON.parse(process.argv[1]); if(h.version!=="2.7.0"||h.schemaVersion!==7||h.agentStorage!=="d1") process.exit(1)' "$health"
          curl --fail '${{ vars.WORKER_BASE_URL }}/.well-known/oauth-authorization-server' >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' '${{ vars.WORKER_BASE_URL }}/v1/quests')" = "401"
      - name: Smoke test public routes
        shell: bash
        run: |
          root_html="$(curl --fail --retry 5 --retry-delay 3 "$SITE_URL/")"
          grep -q '<title>Guilduo</title>' <<<"$root_html"
          grep -q '<h1>Guilduo</h1>' <<<"$root_html"
          curl --fail --retry 5 --retry-delay 3 "$SITE_URL/next/" >/dev/null
          curl --fail '${{ vars.WORKER_BASE_URL }}/.well-known/oauth-protected-resource/mcp' >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST '${{ vars.WORKER_BASE_URL }}/mcp')" = "401"
        env:
          SITE_URL: ${{ steps.appwrite_site.outputs.url }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
