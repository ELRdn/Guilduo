name: Tagged Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag version, release notes and main ancestry
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"),assert=require("node:assert/strict"); const version=JSON.parse(fs.readFileSync("package.json","utf8")).version,lock=JSON.parse(fs.readFileSync("package-lock.json","utf8")); assert.match(version,/^\d+\.\d+\.\d+(?:-[a-z0-9.]+)?$/); assert.equal(lock.version,version); assert.equal(lock.packages[""].version,version); assert.equal(process.env.GITHUB_REF_NAME,`v${version}`); assert.ok(fs.readFileSync(`docs/releases/v${version}.md`,"utf8").trim());'
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - name: Prepare isolated example configuration
        run: |
          cp appwrite-config.example.js appwrite-config.js
          node -e "const fs=require('node:fs');const p='appwrite-config.js';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replaceAll('YOUR_APPWRITE_PROJECT_ID','local-entry-test'))"
          cp runtime-config.example.js runtime-config.js
          cp wrangler.example.jsonc wrangler.jsonc
      - run: npm run api:generate && git diff --exit-code -- api/openapi.json api/mcp-tools.json
      - run: npm run design:check
      - run: npx -y -p @google/design.md designmd lint DESIGN.md
      - run: npx -y -p @google/design.md designmd lint interaction-lab/DESIGN.md
      - run: npm run check
      - run: npm run brand:assets -- --check
      - run: npm test
      - run: node --test plugins/guilduo-claude/tests/package.test.mjs
      - run: npm run build
      - name: Verify public candidate before GitHub publication
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4175 --strictPort > /tmp/guilduo-release-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4175/privacy/ >/dev/null && break; sleep 1; done
          npm run lp:verify -- http://127.0.0.1:4175
          npm run docs:verify -- http://127.0.0.1:4175
          npm run solutions:verify -- http://127.0.0.1:4175
          npm run launch:verify -- http://127.0.0.1:4175 --built
      - name: Publish source release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
          make_latest: true
