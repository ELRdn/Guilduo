name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp firebase-config.example.js firebase-config.js
      - run: cp runtime-config.example.js runtime-config.js
      - run: npm run api:generate
      - run: npm run check
      - run: npm test
      - run: npm run build
