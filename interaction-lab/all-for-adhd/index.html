    <script>
      // Shares the Relay Forge theme choice and applies it before first paint.
      (function () {
        var stored = null;
        try { stored = window.localStorage.getItem("qf-relay-forge-theme"); } catch (error) { stored = null; }
        if (stored === "light" || stored === "dark") document.documentElement.setAttribute("data-theme", stored);
        // Bloom is the default palette; "plain" keeps the Relay Forge tokens.
        var palette = null;
        try { palette = window.localStorage.getItem("a4-palette"); } catch (error) { palette = null; }
        if (palette !== "plain") document.documentElement.setAttribute("data-a4-palette", "bloom");
      })();
    </script>
