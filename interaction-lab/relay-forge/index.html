<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:image" content="__GUILDUO_PUBLIC_ORIGIN__/assets/brand/og-guilduo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__GUILDUO_PUBLIC_ORIGIN__/assets/brand/og-guilduo.png" />
    <title>Guilduo — Relay Forge / Command</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="../../assets/icons/favicon-48.png" />
    <script>
      // Section 27: do not flash the wrong theme before hydration. This runs
      // before first paint and mirrors readStoredTheme() in shell.ts.
      (function () {
        var requested = new URLSearchParams(window.location.search).get("theme");
        var stored = null;
        try {
          stored = window.localStorage.getItem("qf-relay-forge-theme");
        } catch (error) {
          stored = null;
        }
        var theme = requested || stored || "system";
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      })();
    </script>
  </head>
  <body>
    <a class="rf-skip-link" href="#rf-workfield">Workfield へスキップ</a>
    <div id="relay-forge-root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
